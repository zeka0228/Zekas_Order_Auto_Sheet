# 초기 셋업 절차는 SETUP.md 를 따른다. (D1·KV·시크릿·마이그레이션·배포)
# 두 placeholder(database_id, id)를 채우지 않으면 wrangler deploy/dev 실패.

name = "zoas-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 — 글로벌 config DB
# `pnpm --filter @zoas/worker exec wrangler d1 create zoas-configs` 출력의 database_id 주입
[[d1_databases]]
binding = "DB"
database_name = "zoas-configs"
database_id = "84aad6cb-cb49-4766-8fb8-9a01d1bfa954"
migrations_dir = "migrations"

# KV — rate-limit 카운터
# `pnpm --filter @zoas/worker exec wrangler kv namespace create RATE_LIMIT` 출력의 id 주입
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e0c1892867c840408fae6383f809135b"

# 개발자 Anthropic 키 — `pnpm --filter @zoas/worker exec wrangler secret put ANTHROPIC_API_KEY` 로 설정.
# [vars] 에 평문으로 두지 말 것. 로컬 dev는 .dev.vars 사용 (.gitignore 됨).

[observability]
enabled = true
