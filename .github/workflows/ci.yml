name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: install + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # v4의 mutable tag가 가리키던 SHA(b906affc...)가 codeload에서 사라져 다운로드 실패 →
        # 최신 stable immutable tag로 고정 (옵션 호환 그대로).
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.10'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (all workspaces)
        run: pnpm -r test

      - name: Build extension
        run: pnpm build:ext
